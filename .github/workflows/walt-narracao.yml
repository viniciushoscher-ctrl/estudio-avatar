name: Walt narração
run-name: Walt narração ${{ github.run_number }} (${{ inputs.roteiro || 'walt/video1/roteiro.txt' }})

# Narração inteira de um vídeo do Walt: um wav por linha do roteiro, na voz 3 aprovada
# (Qwen3-TTS clonando walt-c + 50% walt-b, tom -0,7, ritmo 0,88), em 8 máquinas de CPU grátis.
# Depois: Resemble Enhance (HD), EQ leve, 48 kHz e -16 LUFS. Artefato: narracao-hd.
on:
  workflow_dispatch:
    inputs:
      roteiro:
        description: roteiro (uma linha por fala)
        default: walt/video1/roteiro.txt
  push:
    branches: [claude/project-thread-1gotel]
    paths: [walt/video1/roteiro.txt]

permissions:
  contents: read

env:
  ROTEIRO: ${{ inputs.roteiro || 'walt/video1/roteiro.txt' }}

jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        parte: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qwen3-tts-base-v1
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sox ffmpeg > /dev/null
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q qwen-tts soundfile librosa
      - run: CLIPES=1 VOZ=walt-c VOZ_MISTURA=walt-b:0.5 python motor/voz_hiroshi.py "$ROTEIRO" saida --parte ${{ matrix.parte }} --partes 8
      - name: Tom -0,7 e ritmo 0,88 (rubberband, formantes preservados)
        run: |
          P=$(python3 -c "print(2**(-0.7/12))")
          for f in saida/*.wav; do
            ffmpeg -loglevel error -y -i "$f" -af "rubberband=pitch=$P:tempo=0.88:formant=preserved:pitchq=quality:window=standard" -ar 24000 "$f.tmp.wav"
            mv "$f.tmp.wav" "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bruto-${{ matrix.parte }}
          path: saida/

  hd:
    needs: voz
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        parte: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bruto-${{ matrix.parte }}
          path: bruto
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch
            ~/.cache/huggingface
          key: resemble-enhance-v1
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q torch==2.1.1 torchaudio==2.1.1 --index-url https://download.pytorch.org/whl/cpu
          DS_BUILD_OPS=0 pip install -q resemble-enhance
      - name: Resemble Enhance (CPU)
        run: resemble-enhance bruto realcado --device cpu
      - name: EQ leve, 48 kHz, -16 LUFS
        run: |
          mkdir -p hd
          for f in bruto/*.wav; do
            n=$(basename "$f"); src="realcado/$n"; [ -f "$src" ] || src="$f"
            ffmpeg -loglevel error -y -i "$src" -af "highpass=f=70,equalizer=f=3200:t=q:w=1.2:g=1.5,loudnorm=I=-16:TP=-1.5:LRA=11" -ar 48000 -ac 1 "hd/$n"
          done
          ls hd | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: hd-${{ matrix.parte }}
          path: hd/
