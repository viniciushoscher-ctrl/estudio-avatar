name: Gerar vídeo

# Este repositório é público e só tem o motor. Seu vídeo de treino, seus roteiros e os
# vídeos gerados ficam num repositório PRIVADO (dados_repo), acessado pelo segredo DADOS_TOKEN.

on:
  workflow_dispatch:
    inputs:
      etapa:
        description: "voz = só o áudio, para você ouvir primeiro. video = voz e boca."
        type: choice
        options: [voz, video]
        default: voz
      video_treino:
        description: "tag/arquivo de uma Release do repositório de dados (ex.: treino/meu-video.mov). 'sintetico' só confere a instalação."
        required: true
      roteiro:
        description: "Arquivo do roteiro (procura primeiro no repositório de dados, depois neste)"
        default: roteiros/teste-15s.txt
      idioma:
        type: choice
        options: [pt, en, es]
        default: pt
      formato:
        type: choice
        options: [vertical, quadrado, horizontal]
        default: vertical
      inicio_voz:
        description: "Segundo do treino onde começa uma fala limpa (usa 12 s)"
        default: "5"
      inicio_video:
        description: "Segundo do treino com o rosto de frente e a boca fechada (usa 8 s)"
        default: "5"
      dados_repo:
        description: "Nome do repositório privado com os seus dados"
        default: estudio-avatar-dados

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      WAV2LIP_COMMIT: bac9a81e63ecc153202353372e5724b83d9e6322
      HF_WAV2LIP: https://huggingface.co/camenduru/Wav2Lip/resolve/main
      DADOS: ${{ github.repository_owner }}/${{ inputs.dados_repo }}
      REAL: ${{ inputs.video_treino != 'sintetico' }}
    steps:
      - name: Conferir o segredo de acesso aos seus dados
        if: env.REAL == 'true'
        env:
          DADOS_TOKEN: ${{ secrets.DADOS_TOKEN }}
        run: |
          if [[ -z "$DADOS_TOKEN" ]]; then
            echo "::error::Falta o segredo DADOS_TOKEN (Settings > Secrets and variables > Actions). Veja o README."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: motor/requirements.txt

      - name: Instalar ffmpeg e bibliotecas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r motor/requirements.txt

      - name: Modelo de voz (cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-mtl-v1

      - name: Wav2Lip e pesos (cache)
        id: w2l
        uses: actions/cache@v4
        with:
          path: |
            Wav2Lip
            pesos
          key: wav2lip-${{ env.WAV2LIP_COMMIT }}-v1

      - name: Baixar Wav2Lip e pesos
        if: steps.w2l.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/Rudrabha/Wav2Lip.git Wav2Lip
          git -C Wav2Lip checkout -q "$WAV2LIP_COMMIT"
          mkdir -p pesos
          curl -fL --retry 3 -o pesos/wav2lip_gan.pth "$HF_WAV2LIP/checkpoints/wav2lip_gan.pth"
          curl -fL --retry 3 -o Wav2Lip/face_detection/detection/sfd/s3fd.pth \
            "$HF_WAV2LIP/face_detection/detection/sfd/s3fd.pth"
          # O nome oficial do arquivo (s3fd-619a316812.pth) traz o começo do SHA-256 dele.
          sha256sum Wav2Lip/face_detection/detection/sfd/s3fd.pth | grep -q '^619a316812'

      - name: Ajustar o Wav2Lip às bibliotecas atuais
        run: python motor/patch_wav2lip.py Wav2Lip

      - name: Baixar o vídeo de treino
        env:
          GH_TOKEN: ${{ secrets.DADOS_TOKEN }}
          ENTRADA: ${{ inputs.video_treino }}
        run: |
          mkdir -p treino
          if [[ "$ENTRADA" == "sintetico" ]]; then
            # Só para conferir a instalação: vídeo e tom falsos (a voz sai sem sentido, e tudo bem).
            ffmpeg -loglevel error -f lavfi -i testsrc=s=640x480:r=25:d=30 \
              -f lavfi -i "sine=frequency=180:duration=30" -c:v libx264 -c:a aac -f mp4 treino/treino.video
          elif [[ "$ENTRADA" != */* ]]; then
            # Só a tag (ex.: treino): usa o primeiro arquivo anexado a essa Release.
            gh release download "$ENTRADA" -p '*' --dir treino --repo "$DADOS"
            mv "$(ls treino/* | head -n 1)" treino/treino.video
          else
            gh release download "${ENTRADA%%/*}" -p "${ENTRADA#*/}" --dir treino --repo "$DADOS"
            mv "treino/${ENTRADA#*/}" treino/treino.video
          fi
          ls -la treino

      - name: Gerar
        env:
          GH_TOKEN: ${{ secrets.DADOS_TOKEN }}
          ETAPA: ${{ inputs.etapa }}
          ROTEIRO: ${{ inputs.roteiro }}
          IDIOMA: ${{ inputs.idioma }}
          FORMATO: ${{ inputs.formato }}
          INICIO_VOZ: ${{ inputs.inicio_voz }}
          INICIO_VIDEO: ${{ inputs.inicio_video }}
        run: |
          EXTRA=()
          if [[ "$ETAPA" == "voz" ]]; then EXTRA+=(--so-voz); fi
          # Seu roteiro privado tem prioridade; o de teste público vale como reserva.
          ARQ="$ROTEIRO"
          if [[ "$REAL" == "true" ]]; then
            mkdir -p dados
            if gh api -H "Accept: application/vnd.github.raw" "repos/$DADOS/contents/$ROTEIRO" > "dados/roteiro.txt" 2>/dev/null; then
              ARQ="dados/roteiro.txt"
            fi
          fi
          python motor/gerar.py \
            --treino treino/treino.video \
            --roteiro "$ARQ" \
            --saida saida \
            --idioma "$IDIOMA" \
            --formato "$FORMATO" \
            --inicio-voz "$INICIO_VOZ" \
            --inicio-video "$INICIO_VIDEO" \
            --wav2lip Wav2Lip \
            --pesos pesos/wav2lip_gan.pth \
            "${EXTRA[@]}"

      # Nada é publicado neste repositório (público): o resultado vai para a Release
      # "resultados" do seu repositório privado.
      - name: Enviar o resultado para o seu repositório privado
        if: env.REAL == 'true'
        env:
          GH_TOKEN: ${{ secrets.DADOS_TOKEN }}
          RUN: ${{ github.run_number }}
        run: |
          gh release view resultados --repo "$DADOS" >/dev/null 2>&1 \
            || gh release create resultados --repo "$DADOS" --prerelease \
                 --title "Resultados" --notes "Vídeos e áudios gerados."
          if [[ -f saida/video_final.mp4 ]]; then
            cp saida/video_final.mp4 "saida/video-$RUN.mp4"
            gh release upload resultados "saida/video-$RUN.mp4" --repo "$DADOS" --clobber
          fi
          if [[ -f saida/voz.mp3 ]]; then
            cp saida/voz.mp3 "saida/voz-$RUN.mp3"
            gh release upload resultados "saida/voz-$RUN.mp3" --repo "$DADOS" --clobber
          fi
          echo "Enviado para a Release 'resultados' de $DADOS."
