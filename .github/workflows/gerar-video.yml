name: Gerar vídeo
# O estúdio (estudio/index.html) encontra a própria execução pelo código do pedido no título.
run-name: Gerar ${{ inputs.etapa }} ${{ inputs.pedido }}

# Este repositório é público e só tem o motor. Seu vídeo de treino, seus roteiros e os
# vídeos gerados ficam num repositório PRIVADO (dados_repo), acessado pelo segredo DADOS_TOKEN.

on:
  workflow_dispatch:
    inputs:
      etapa:
        description: "voz = só o áudio, para você ouvir primeiro. video = voz e boca."
        type: choice
        options: [voz, video]
        default: voz
      video_treino:
        description: "tag/arquivo de uma Release do repositório de dados (ex.: treino/meu-video.mov). 'sintetico' só confere a instalação."
        required: true
      video_url:
        description: "Só com video_treino=drive: link compartilhado do vídeo (baixado uma vez e guardado na Release treino do repositório privado)"
        default: ""
      roteiro:
        description: "Arquivo do roteiro (procura primeiro no repositório de dados, depois neste)"
        default: roteiros/teste-15s.txt
      idioma:
        type: choice
        options: [pt, en, es]
        default: pt
      formato:
        type: choice
        options: [vertical, feed, quadrado, horizontal]
        default: vertical
      inicio_voz:
        description: "Segundo do treino onde começa uma fala limpa (usa 12 s)"
        default: "5"
      inicio_video:
        description: "Segundo do treino com o rosto de frente, parado e sem gestos (usa 8 s)"
        default: "44"
      dados_repo:
        description: "Nome do repositório privado com os seus dados"
        default: estudio-avatar-dados
      pedido:
        description: "Usado pelo estúdio: pedidos/ID.json no repositório de dados (roteiro, voz, formato e ajustes). Deixe vazio ao rodar à mão."
        default: ""

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      WAV2LIP_COMMIT: bac9a81e63ecc153202353372e5724b83d9e6322
      HF_WAV2LIP: https://huggingface.co/camenduru/Wav2Lip/resolve/main
      DADOS: ${{ github.repository_owner }}/${{ inputs.dados_repo }}
      REAL: ${{ inputs.video_treino != 'sintetico' }}
    steps:
      - name: Conferir o segredo de acesso aos seus dados
        if: env.REAL == 'true'
        env:
          DADOS_TOKEN: ${{ secrets.DADOS_TOKEN }}
        run: |
          if [[ -z "$DADOS_TOKEN" ]]; then
            echo "::error::Falta o segredo DADOS_TOKEN (Settings > Secrets and variables > Actions). Veja o README."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: motor/requirements.txt

      - name: Instalar ffmpeg e bibliotecas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install torch==2.6.0 torchaudio==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r motor/requirements.txt

      # Voz com sotaque brasileiro (F5-TTS pt-br). Ambiente separado; se falhar, o Gerar usa o Chatterbox.
      - name: Voz pt-br (F5-TTS) em ambiente separado
        if: vars.VOZ_MOTOR == 'f5'
        continue-on-error: true
        run: |
          python -m venv f5env
          f5env/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          # Trava torch/torchaudio na versão CPU para o f5-tts não trocar por uma versão de GPU.
          f5env/bin/pip freeze | grep -E '^(torch|torchaudio)==' > f5-trava.txt
          f5env/bin/pip install -q -c f5-trava.txt -r motor/requirements-f5.txt
          f5env/bin/pip uninstall -y torchcodec >/dev/null 2>&1 || true  # feito para outro torch
          f5env/bin/pip freeze | grep -iE '^(torch|torchaudio|torchcodec|numpy)=' | tr '\n' ' ' | sed 's/^/::notice::F5 env: /'
          f5env/bin/python -c "import f5_tts.api, num2words; print('F5-TTS pronto')" 2>&1 | tail -3 | tr '\n' ' ' | sed 's/^/::notice::F5 import: /'
          f5env/bin/python -c "import f5_tts.api"

      - name: Modelos de voz (cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: vozes-chatterbox-f5ptbr-v1

      - name: Wav2Lip e pesos (cache)
        id: w2l
        uses: actions/cache@v4
        with:
          path: |
            Wav2Lip
            pesos
          key: wav2lip-${{ env.WAV2LIP_COMMIT }}-v1

      - name: Baixar Wav2Lip e pesos
        if: steps.w2l.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/Rudrabha/Wav2Lip.git Wav2Lip
          git -C Wav2Lip checkout -q "$WAV2LIP_COMMIT"
          mkdir -p pesos
          curl -fL --retry 3 -o pesos/wav2lip_gan.pth "$HF_WAV2LIP/checkpoints/wav2lip_gan.pth"
          curl -fL --retry 3 -o Wav2Lip/face_detection/detection/sfd/s3fd.pth \
            "$HF_WAV2LIP/face_detection/detection/sfd/s3fd.pth"
          # O nome oficial do arquivo (s3fd-619a316812.pth) traz o começo do SHA-256 dele.
          sha256sum Wav2Lip/face_detection/detection/sfd/s3fd.pth | grep -q '^619a316812'

      - name: Pesos da restauração do rosto (cache)
        if: inputs.etapa == 'video'
        id: realce
        uses: actions/cache@v4
        with:
          path: |
            pesos-realce
            gfpgan/weights
          key: gfpgan-v1.4-v1

      - name: Baixar pesos da restauração do rosto
        if: inputs.etapa == 'video' && steps.realce.outputs.cache-hit != 'true'
        run: |
          mkdir -p pesos-realce
          curl -fL --retry 3 -o pesos-realce/GFPGANv1.4.pth \
            https://github.com/TencentARC/GFPGAN/releases/download/v1.3.0/GFPGANv1.4.pth

      - name: Ajustar o Wav2Lip às bibliotecas atuais
        run: python motor/patch_wav2lip.py Wav2Lip

      - name: Baixar o vídeo de treino
        env:
          GH_TOKEN: ${{ secrets.DADOS_TOKEN }}
          ENTRADA: ${{ inputs.video_treino }}
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          mkdir -p treino
          if [[ "$ENTRADA" == "drive" ]]; then
            [[ "$VIDEO_URL" =~ ^https://drive\.google\.com/[A-Za-z0-9_./?=\&-]+$ ]] \
              || { echo "::error::video_url precisa ser um link https://drive.google.com/..."; exit 1; }
            # Arquivos grandes caem na página "verificação de vírus" do Drive; confirm=t pula essa página.
            ID=$(sed -nE 's#.*/d/([A-Za-z0-9_-]+).*#\1#p; s#.*[?&]id=([A-Za-z0-9_-]+).*#\1#p' <<<"$VIDEO_URL" | head -n 1)
            [[ -n "$ID" ]] || { echo "::error::Não achei o código do arquivo no link do Drive."; exit 1; }
            curl -fsSL --retry 3 -o treino/treino.video \
              "https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t" || true
            if ! ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 treino/treino.video 2>/dev/null | grep -q video; then
              echo "download direto não trouxe um vídeo; tentando com gdown"
              pip install -q gdown
              gdown --fuzzy "$VIDEO_URL" -O treino/treino.video \
                || { echo "::error::Não consegui baixar o link. Em Compartilhar, deixe 'Qualquer pessoa com o link'."; exit 1; }
            fi
            echo "treino: $(du -h treino/treino.video | cut -f1) baixados do Drive"
            # Guarda uma cópia na Release privada para as próximas execuções não dependerem do Drive.
            gh release view treino --repo "$DADOS" >/dev/null 2>&1 \
              || gh release create treino --repo "$DADOS" --title "Treino" --notes "Vídeo de treino."
            cp treino/treino.video treino/video-treino.mp4
            gh release upload treino treino/video-treino.mp4 --repo "$DADOS" --clobber
            rm treino/video-treino.mp4
          elif [[ "$ENTRADA" == "nenhum" ]]; then
            # Texto para fala do estúdio: só a voz, sem vídeo de treino.
            echo "sem vídeo de treino"; exit 0
          elif [[ "$REAL" == "true" && "$ENTRADA" == */* ]] && gh api -H "Accept: application/vnd.github.raw" \
               "repos/$DADOS/contents/$ENTRADA" > treino/treino.video 2>/dev/null; then
            # Vídeo enviado pelo estúdio como arquivo do repositório de dados.
            echo "treino lido dos arquivos do repositório de dados"
          elif [[ "$ENTRADA" == "sintetico" ]]; then
            # Só para conferir a instalação: vídeo e tom falsos (a voz sai sem sentido, e tudo bem).
            ffmpeg -loglevel error -f lavfi -i testsrc=s=640x480:r=25:d=30 \
              -f lavfi -i "sine=frequency=180:duration=30" -c:v libx264 -c:a aac -f mp4 treino/treino.video
          elif [[ "$ENTRADA" != */* ]]; then
            # Só a tag (ex.: treino): usa o primeiro arquivo anexado a essa Release.
            if gh release download "$ENTRADA" -p '*' --dir treino --repo "$DADOS" 2>/dev/null; then
              mv "$(ls treino/* | head -n 1)" treino/treino.video
            else
              # Sem Release: procura um vídeo nos arquivos do próprio repositório de dados.
              CAMINHO=$(gh api "repos/$DADOS/git/trees/HEAD?recursive=1" --jq \
                '[.tree[] | select(.type=="blob") | select(.path|test("\\.(mp4|mov|m4v|webm|mkv)$";"i")) | .path][0] // empty')
              if [[ -z "$CAMINHO" ]]; then echo "::error::Não achei vídeo na Release '$ENTRADA' nem no repositório de dados."; exit 1; fi
              echo "Vídeo encontrado no repositório: $CAMINHO"
              gh api -H "Accept: application/vnd.github.raw" "repos/$DADOS/contents/$CAMINHO" > treino/treino.video
            fi
          else
            if gh release download "${ENTRADA%%/*}" -p "${ENTRADA#*/}" --dir treino --repo "$DADOS" 2>erro.txt; then
              mv "treino/${ENTRADA#*/}" treino/treino.video
            else
              echo "::warning::Release: $(tr '\n' ' ' < erro.txt | cut -c1-300)"
              # Não é Release: trata como caminho de um arquivo do repositório de dados (ex.: treino/ID.webm).
              gh api -H "Accept: application/vnd.github.raw" "repos/$DADOS/contents/$ENTRADA" > treino/treino.video \
                || { echo "::error::Não achei '$ENTRADA' na Release nem nos arquivos do repositório de dados."; exit 1; }
            fi
          fi
          ls -la treino

      - name: Gerar
        env:
          GH_TOKEN: ${{ secrets.DADOS_TOKEN }}
          ETAPA: ${{ inputs.etapa }}
          ROTEIRO: ${{ inputs.roteiro }}
          IDIOMA: ${{ inputs.idioma }}
          FORMATO: ${{ inputs.formato }}
          INICIO_VOZ: ${{ inputs.inicio_voz }}
          INICIO_VIDEO: ${{ inputs.inicio_video }}
          PEDIDO: ${{ inputs.pedido }}
          # Ajuste fino da sincronia boca/voz, em ms (positivo = boca mais tarde). Mude em
          # Settings > Secrets and variables > Actions > Variables, sem mexer no código.
          ATRASO_BOCA_MS: ${{ vars.ATRASO_BOCA_MS || '0' }}
          # Voz: F5-TTS pt-br (padrão) ou Chatterbox (variável do repositório VOZ_MOTOR = f5 liga a F5).
          VOZ_F5_PYTHON: ${{ github.workspace }}/f5env/bin/python
          VOZ_MOTOR: ${{ vars.VOZ_MOTOR || 'chatterbox' }}
        run: |
          EXTRA=()
          if [[ "$ETAPA" == "voz" ]]; then EXTRA+=(--so-voz); else EXTRA+=(--realce pesos-realce/GFPGANv1.4.pth); fi
          if [[ -f treino/treino.video ]]; then EXTRA+=(--treino treino/treino.video); fi
          # Pedido do estúdio (repositório de dados): substitui roteiro e formato e traz voz e ajustes.
          mkdir -p dados
          raw() { gh api -H "Accept: application/vnd.github.raw" "repos/$DADOS/contents/$1"; }
          if [[ -n "$PEDIDO" ]]; then
            P=dados/pedido.json
            raw "$PEDIDO" > "$P" 2>/dev/null || { echo "::error::Pedido não encontrado no repositório de dados."; exit 1; }
            ROTEIRO=$(jq -r '.roteiro' "$P")
            FORMATO=$(jq -r '.formato // "vertical"' "$P")
            IDIOMA=$(jq -r '.idioma // "pt"' "$P")
            EXTRA+=(--exagero "$(jq -r '.exagero // 0.6' "$P")" --cfg "$(jq -r '.cfg // 0.55' "$P")")
            ATRASO_BOCA_MS=$(jq -r --arg d "$ATRASO_BOCA_MS" '.atraso_boca_ms // $d' "$P")
            VOZ=$(jq -r '.voz_ref // empty' "$P")
            if [[ -n "$VOZ" ]]; then
              raw "$VOZ" > "dados/voz.${VOZ##*.}" || { echo "::error::Amostra de voz não encontrada."; exit 1; }
              EXTRA+=(--voz-ref "dados/voz.${VOZ##*.}")
            fi
          fi
          # Seu roteiro privado tem prioridade; o de teste público vale como reserva.
          ARQ="$ROTEIRO"
          if [[ "$REAL" == "true" ]]; then
            if gh api -H "Accept: application/vnd.github.raw" "repos/$DADOS/contents/$ROTEIRO" > "dados/roteiro.txt" 2>/dev/null; then
              ARQ="dados/roteiro.txt"
            fi
          fi
          python motor/gerar.py \
            --roteiro "$ARQ" \
            --saida saida \
            --idioma "$IDIOMA" \
            --formato "$FORMATO" \
            --inicio-voz "$INICIO_VOZ" \
            --inicio-video "$INICIO_VIDEO" \
            --wav2lip Wav2Lip \
            --pesos pesos/wav2lip_gan.pth \
            --atraso-boca-ms "$ATRASO_BOCA_MS" \
            "${EXTRA[@]}"

      # Nada é publicado neste repositório (público): o resultado vai para a Release
      # "resultados" do seu repositório privado.
      - name: Enviar o resultado para o seu repositório privado
        if: env.REAL == 'true'
        env:
          GH_TOKEN: ${{ secrets.DADOS_TOKEN }}
          RUN: ${{ github.run_number }}
          PEDIDO: ${{ inputs.pedido }}
        run: |
          # Pedidos do estúdio saem com o código do pedido no nome, para ele achar o arquivo.
          if [[ -n "$PEDIDO" ]]; then RUN=$(basename "$PEDIDO" .json); fi
          gh release view resultados --repo "$DADOS" >/dev/null 2>&1 \
            || gh release create resultados --repo "$DADOS" --prerelease \
                 --title "Resultados" --notes "Vídeos e áudios gerados."
          if [[ -f saida/video_final.mp4 ]]; then
            cp saida/video_final.mp4 "saida/video-$RUN.mp4"
            gh release upload resultados "saida/video-$RUN.mp4" --repo "$DADOS" --clobber
          fi
          if [[ -f saida/voz.mp3 ]]; then
            cp saida/voz.mp3 "saida/voz-$RUN.mp3"
            gh release upload resultados "saida/voz-$RUN.mp3" --repo "$DADOS" --clobber
          fi
          echo "Enviado para a Release 'resultados' de $DADOS."
