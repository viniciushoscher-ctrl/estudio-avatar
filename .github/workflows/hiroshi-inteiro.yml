name: Hiroshi o vídeo inteiro
run-name: Hiroshi inteiro ${{ github.run_number }} (${{ inputs.roteiro || 'roteiros/amostra-podcast.txt' }})

# Formato "avatar o tempo todo" (como o canal Thomas Becker):
# 1) voz do Hiroshi (Qwen3-TTS) em 8 máquinas
# 2) base viva do LongCat esticada sem repetição + boca do LatentSync 1.6 (GPU da Modal, pedaços de 60 s em paralelo)
# 3) legenda palavra por palavra (faster-whisper) e saída em 1080p

on:
  workflow_dispatch:
    inputs:
      roteiro:
        description: "Arquivo do roteiro (um parágrafo por linha)"
        default: roteiros/amostra-podcast.txt
      base:
        description: "Vídeo-base do Hiroshi (LongCat)"
        default: bases/base-hiroshi-mesa.mp4
  push:
    branches: [claude/project-thread-f10yr5]
    paths: [roteiros/amostra-podcast.txt, .github/workflows/hiroshi-inteiro.yml]

permissions:
  contents: read

env:
  ROTEIRO: ${{ inputs.roteiro || 'roteiros/amostra-podcast.txt' }}
  BASE: ${{ inputs.base || 'bases/base-hiroshi-mesa.mp4' }}
  PARTES_VOZ: 8

jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      matrix:
        parte: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qwen3-tts-base-v1
      - name: Falar a parte ${{ matrix.parte }}
        run: |
          sudo apt-get install -y -qq sox > /dev/null
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q qwen-tts soundfile
          python motor/voz_hiroshi.py "$ROTEIRO" voz-${{ matrix.parte }}.wav --parte ${{ matrix.parte }} --partes $PARTES_VOZ
          touch voz-${{ matrix.parte }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: voz-${{ matrix.parte }}
          if-no-files-found: ignore
          path: voz-${{ matrix.parte }}.wav

  hiroshi:
    needs: voz
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: voz-*
          merge-multiple: true
      - name: Fala completa
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          ls voz-*.wav | sort -t- -k2 -n | sed "s/^/file '/; s/$/'/" > lista.txt
          ffmpeg -loglevel error -f concat -safe 0 -i lista.txt -ar 24000 -ac 1 fala.wav
          echo "Fala: $(ffprobe -v error -show_entries format=duration -of csv=p=0 fala.wav) s"
      - name: Hiroshi falando tudo (LongCat + LatentSync, GPU da Modal)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          pip install -q modal
          modal run gpu/latentsync.py --base "$BASE" --audio fala.wav --saida saida/sem-legenda.mp4
      - name: Legenda palavra por palavra + 1080p
        run: |
          pip install -q faster-whisper
          python motor/legendas.py saida/sem-legenda.mp4 saida/hiroshi-inteiro.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: hiroshi-inteiro-${{ github.run_number }}
          path: |
            saida/hiroshi-inteiro.mp4
            saida/sem-legenda.mp4
