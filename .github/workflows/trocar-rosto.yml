name: Trocar rosto
run-name: Trocar rosto ${{ github.run_number }}

# Mantém o seu corpo, a sua cabeça e a sua boca do vídeo gravado e troca só o rosto pelo do avatar.
# O resultado vai para a Release "resultados" do repositório privado.

on:
  workflow_dispatch:
    inputs:
      imagem:
        description: "Imagem do avatar neste repositório"
        default: avatares/rosto-japones.png
      video_treino:
        description: "tag/arquivo de uma Release do repositório de dados"
        default: treino/video-treino.mp4
      inicio:
        default: "12"
      duracao:
        default: "6"
      forca:
        description: "Nitidez do rosto (0 a 1); mais alto = mais nítido, porém mais cara de IA"
        default: "0.6"
      dados_repo:
        default: estudio-avatar-dados

permissions:
  contents: read

jobs:
  trocar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DADOS: ${{ github.repository_owner }}/${{ inputs.dados_repo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2" opencv-python-headless==4.10.0.84 onnxruntime==1.18.0 insightface==0.7.3 gfpgan==1.3.8
      - uses: actions/cache@v4
        with:
          path: |
            pesos
            ~/.insightface
          key: troca-rosto-pesos-v1
      - name: Baixar os pesos
        run: |
          mkdir -p pesos
          [[ -f pesos/inswapper_128.onnx ]] || curl -fL --retry 3 -o pesos/inswapper_128.onnx \
            https://github.com/facefusion/facefusion-assets/releases/download/models/inswapper_128.onnx
          [[ -f pesos/GFPGANv1.4.pth ]] || curl -fL --retry 3 -o pesos/GFPGANv1.4.pth \
            https://github.com/TencentARC/GFPGAN/releases/download/v1.3.0/GFPGANv1.4.pth
      - name: Baixar e cortar o vídeo
        env:
          GH_TOKEN: ${{ secrets.DADOS_TOKEN }}
          ENTRADA: ${{ inputs.video_treino }}
          INICIO: ${{ inputs.inicio }}
          DURACAO: ${{ inputs.duracao }}
        run: |
          mkdir -p treino
          gh release download "${ENTRADA%%/*}" -p "${ENTRADA#*/}" --dir treino --repo "$DADOS"
          ffmpeg -loglevel error -y -ss "$INICIO" -t "$DURACAO" -i "treino/${ENTRADA#*/}" \
            -vf "fps=25" -c:v libx264 -crf 16 -c:a aac corte.mp4
      - name: Trocar o rosto
        env:
          IMAGEM: ${{ inputs.imagem }}
          FORCA: ${{ inputs.forca }}
        run: |
          python motor/trocar_rosto.py "$IMAGEM" corte.mp4 mudo.mp4 pesos/inswapper_128.onnx pesos/GFPGANv1.4.pth "$FORCA"
          ffmpeg -loglevel error -y -i mudo.mp4 -i corte.mp4 -map 0:v -map 1:a? -c:v libx264 -crf 18 -pix_fmt yuv420p -c:a aac -shortest final.mp4
      - name: Enviar o resultado para o seu repositório privado
        env:
          GH_TOKEN: ${{ secrets.DADOS_TOKEN }}
          RUN: ${{ github.run_number }}
        run: |
          cp final.mp4 "troca-$RUN.mp4"
          gh release upload resultados "troca-$RUN.mp4" --repo "$DADOS" --clobber
