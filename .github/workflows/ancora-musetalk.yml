name: Âncora trechos (MuseTalk grátis)
run-name: Âncora trechos MuseTalk ${{ github.run_number }} (${{ inputs.pasta || 'push' }})

# RyanRoverMoney: o âncora fala trechos da narração JÁ PRONTA (voz C), 100% grátis na CPU do GitHub, sem Modal.
# Base: bases/base-ancora65.mp4 (vai-e-volta) + MuseTalk 1.5 (MIT) redesenhando só a boca, como no motor=musetalk.
# Entrada: trechos/<id>/*.wav (+ avatar.txt opcional, padrão ancora65).
# Saída: artefato "ancora-<id>" com um .mp4 por .wav (mesmos nomes de antes).
on:
  workflow_dispatch:
    inputs:
      pasta:
        description: "trechos/<id>"
        required: true
  push:
    branches: [claude/project-thread-f10yr5]
    paths: [trechos/*/pronto.txt]

permissions:
  contents: read

env:
  MUSETALK: ${{ github.workspace }}/musetalk
  MUSETALK_COMMIT: 0a89dec

jobs:
  planejar:
    runs-on: ubuntu-latest
    outputs:
      pasta: ${{ steps.p.outputs.pasta }}
      id: ${{ steps.p.outputs.id }}
      base: ${{ steps.p.outputs.base }}
      wavs: ${{ steps.p.outputs.wavs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: p
        run: |
          P="${{ inputs.pasta }}"
          [ -z "$P" ] && P=$(dirname "$(git diff --name-only HEAD~1 HEAD -- 'trechos/*/pronto.txt' | tail -n1)")
          AV=$(cat "$P/avatar.txt" 2>/dev/null | tr -d '[:space:]'); AV=${AV:-ancora65}
          echo "pasta=$P" >> "$GITHUB_OUTPUT"; echo "id=$(basename "$P")" >> "$GITHUB_OUTPUT"
          echo "base=bases/base-$AV.mp4" >> "$GITHUB_OUTPUT"
          echo "wavs=$(python3 -c "import glob,json; print(json.dumps(sorted(glob.glob('$P/*.wav'))))")" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  base:
    needs: planejar
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE: ${{ needs.planejar.outputs.base }}
    steps:
      - uses: actions/checkout@v4
      - &python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - &musetalk
        name: Instalar o MuseTalk
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          git clone -q https://github.com/TMElyralab/MuseTalk "$MUSETALK" && git -C "$MUSETALK" checkout -q "$MUSETALK_COMMIT"
          pip install -q torch==2.4.1 torchvision==0.19.1 torchaudio==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q diffusers==0.30.2 accelerate==0.28.0 "numpy<2" opencv-python-headless==4.9.0.80 soundfile \
            librosa==0.11.0 einops omegaconf transformers==4.39.2 "huggingface_hub==0.30.2" face-alignment setuptools
      - &pesos
        uses: actions/cache@v4
        with:
          path: musetalk/models
          key: musetalk-pesos-v15
      - &baixar
        name: Baixar os pesos
        run: |
          cd "$MUSETALK" && python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download as d
          for repo, files, dest in [
              ("TMElyralab/MuseTalk", ["musetalkV15/musetalk.json", "musetalkV15/unet.pth"], "models"),
              ("stabilityai/sd-vae-ft-mse", ["config.json", "diffusion_pytorch_model.bin"], "models/sd-vae"),
              ("openai/whisper-tiny", ["config.json", "pytorch_model.bin", "preprocessor_config.json"], "models/whisper"),
              ("ManyOtherFunctions/face-parse-bisent", ["79999_iter.pth", "resnet18-5c106cde.pth"], "models/face-parse-bisent")]:
              for f in files:
                  if not os.path.exists(os.path.join(dest, f)):
                      d(repo, f, local_dir=dest)
          PY
      - name: Chave do cache da base
        run: echo "BASE_HASH=$(sha256sum "$BASE" | cut -c1-16)" >> "$GITHUB_ENV"
      - id: cache
        uses: actions/cache@v4
        with:
          path: cache_base
          key: base-${{ env.BASE_HASH }}-v1
      - name: Preparar a base (só quando a base muda)
        if: steps.cache.outputs.cache-hit != 'true'
        run: python motor/boca_longa.py preparar --base "$GITHUB_WORKSPACE/$BASE" --cache "$GITHUB_WORKSPACE/cache_base"

  boca:
    needs: [planejar, base]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        wav: ${{ fromJSON(needs.planejar.outputs.wavs) }}
    env:
      BASE: ${{ needs.planejar.outputs.base }}
    steps:
      - uses: actions/checkout@v4
      - *python
      - *musetalk
      - *pesos
      - *baixar
      - name: Chave do cache da base
        run: echo "BASE_HASH=$(sha256sum "$BASE" | cut -c1-16)" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        with:
          path: cache_base
          key: base-${{ env.BASE_HASH }}-v1
          fail-on-cache-miss: true
      - name: Instalar o realce da boca (GFPGAN 1.4, Apache-2.0)
        run: |
          pip install -q --no-build-isolation basicsr facexlib gfpgan "numpy<2" opencv-python-headless==4.9.0.80
          mkdir -p pesos && curl -sSL -o pesos/GFPGANv1.4.pth \
            https://github.com/TencentARC/GFPGAN/releases/download/v1.3.0/GFPGANv1.4.pth
      - name: Boca de ${{ matrix.wav }}
        run: |
          N=$(basename "${{ matrix.wav }}" .wav)
          mkdir -p clipes
          python motor/boca_longa.py --realce "$GITHUB_WORKSPACE/pesos/GFPGANv1.4.pth" falar --cache "$GITHUB_WORKSPACE/cache_base" \
            --audio "$GITHUB_WORKSPACE/${{ matrix.wav }}" --saida "$GITHUB_WORKSPACE/clipes/$N.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: clipe-${{ strategy.job-index }}
          path: clipes/*.mp4

  juntar:
    needs: [planejar, boca]
    if: ${{ !cancelled() && needs.boca.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: clipe-*
          merge-multiple: true
          path: clipes
      - uses: actions/upload-artifact@v4
        with:
          name: ancora-${{ needs.planejar.outputs.id }}
          path: clipes/
